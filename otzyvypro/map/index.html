<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Карта ОтзывыПро</title>
<style>
:root{--bg:#f5f7fa;--surface:#fff;--fg:#14213a;--muted:#5b6780;--line:#c9d2e2;--accent:#1f4fd8;--warn:#a3560a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1523;--surface:#171f33;--fg:#e6ebf7;--muted:#97a3bf;--line:#2c3857;--accent:#8aa9ff;--warn:#f0b35e;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:16px}
main{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px}
h1{font-size:1.3rem;line-height:1.2;margin:0 0 6px}
p{margin:0 0 18px;color:var(--muted)}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{margin-top:14px;width:100%;font:inherit;font-weight:600;padding:10px 12px;border:0;border-radius:8px;background:var(--accent);color:var(--bg);cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
#err{min-height:1.4em;margin:10px 0 0;color:var(--warn);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1>Карта ОтзывыПро</h1>
  <p>Внутренние материалы. Введите пароль, чтобы открыть.</p>
  <form id="f" autocomplete="off">
    <label for="pw">Пароль</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required>
    <button id="go" type="submit">Открыть</button>
    <div id="err" role="alert"></div>
  </form>
</main>
