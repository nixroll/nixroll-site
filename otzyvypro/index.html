<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Отзывы Про</title>
<style>
:root{--bg:#f5f7fa;--fg:#14213a;--muted:#5b6780;--accent:#1f4fd8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1523;--fg:#e6ebf7;--muted:#97a3bf;--accent:#8aa9ff;color-scheme:dark}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:16px}
main{max-width:380px;width:100%}
h1{font-size:1.3rem;margin:0 0 6px}
p{margin:0 0 14px;color:var(--muted)}
a{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px solid currentColor}
a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Отзывы Про</h1>
  <p>Материалы по продукту.</p>
  <a href="/otzyvypro/map/">Карта продукта →</a>
</main>
</body>
</html>
