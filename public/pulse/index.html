<title>Пульс ОтзывыПро</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&display=swap">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#f4f4f4;color:#161616;font:14px/1.43 'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;display:grid;place-items:center;padding:16px}
main{width:100%;max-width:400px;background:#fff;padding:32px 24px}
h1{font-size:28px;font-weight:300;line-height:1.2;margin:0 0 8px}
p{margin:0 0 24px;color:#525252}
label{display:block;font-size:12px;color:#525252;margin-bottom:8px}
input{width:100%;font:inherit;height:40px;padding:0 16px;border:0;border-bottom:1px solid #8d8d8d;background:#f4f4f4;color:#161616;border-radius:0}
input:focus-visible,button:focus-visible{outline:2px solid #0f62fe;outline-offset:-2px}
button{margin-top:16px;width:100%;font:inherit;min-height:48px;text-align:left;padding:0 16px;border:0;background:#0f62fe;color:#fff;cursor:pointer}
button:hover{background:#0353e9}
button[disabled]{opacity:.6;cursor:progress}
#err{min-height:1.4em;margin:12px 0 0;color:#da1e28;font-size:14px}
#st{display:none}
</style>
