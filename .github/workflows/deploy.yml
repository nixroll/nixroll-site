name: Deploy

# Пуш в master пересобирает сайт статическим экспортом и публикует его
# в ветку gh-pages. Раньше эти шаги выполнялись вручную (см. историю
# коммитов) — этот workflow их заменяет, включая правки, которые нужны
# только для статической сборки: /api/* не работает на GitHub Pages,
# поэтому роуты вырезаются, а next.config.ts на время сборки
# подменяется на export-конфиг (в репозитории он "обычный", чтобы
# next dev с /api работал локально).

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Strip server-only routes (not supported by static export)
        run: rm -rf src/app/api

      - name: Remove ISR revalidate hint (meaningless for static export)
        run: sed -i '/export const revalidate = 60;/d' "src/app/[[...path]]/page.tsx"

      - name: Switch to static-export Next config
        run: |
          cat > next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            output: "export",
            trailingSlash: true,
            images: { unoptimized: true },
          };

          export default nextConfig;
          EOF

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: "https://nixroll.co"
        run: npx next build

      - name: Add GitHub Pages custom-domain files
        run: |
          echo "nixroll.co" > out/CNAME
          touch out/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
