name: Deploy

# Пуш в master пересобирает сайт статическим экспортом и публикует его
# в ветку gh-pages. next.config.ts на время сборки подменяется на
# export-конфиг (в репозитории он "обычный", чтобы next dev работал
# локально без лишних ограничений статического экспорта).

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Next.js кэширует промежуточные результаты компиляции между сборками —
      # ощутимо ускоряет next build, когда меняется не весь код разом.
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Switch to static-export Next config
        run: |
          cat > next.config.ts <<'CONFIG'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            output: "export",
            trailingSlash: true,
            images: { unoptimized: true },
          };

          export default nextConfig;
          CONFIG

      # Футер показывает "updated [дата]" автоматически — дата последнего
      # деплоя, а не ручная правка (решение Никиты, см.
      # claude/site-tz-minimal-redesign.md). Прокидывается в билд через
      # NEXT_PUBLIC_BUILD_DATE и читается в src/lib/build-date.ts.
      - name: Compute build date
        id: build-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: "https://nixroll.co"
          NEXT_PUBLIC_BUILD_DATE: ${{ steps.build-date.outputs.date }}
        run: npx next build

      - name: Add GitHub Pages custom-domain files
        run: |
          echo "nixroll.co" > out/CNAME
          touch out/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
